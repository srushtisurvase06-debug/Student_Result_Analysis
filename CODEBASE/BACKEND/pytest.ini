[pytest]
# Lives in CODEBASE/BACKEND because that is the Python root in production:
# Render runs `gunicorn app:app` from this directory, so `import app` and
# `import config` are the real import contract the tests must exercise.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -ra --strict-markers

markers =
    integration: requires a live database connection; skipped when DATABASE_URL is unset

filterwarnings =
    default
