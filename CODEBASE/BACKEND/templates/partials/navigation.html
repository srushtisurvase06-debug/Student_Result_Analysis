{# Admin navigation menu - Phase 5 implementation (TR-FE-002, TR-STRUCT-021) #}
<nav class="navbar">
    <div class="navbar__brand">
        <a href="{{ url_for('dashboard.index') }}" class="navbar__brand-link">
            <span class="navbar__brand-icon" aria-hidden="true">📊</span>
            <span class="navbar__brand-text">Student Result System</span>
        </a>
    </div>

    <ul class="navbar__menu">
        <li class="navbar__item">
            <a href="{{ url_for('dashboard.index') }}" class="navbar__link{% if request.endpoint == 'dashboard.index' %} navbar__link--active{% endif %}">
                <span class="navbar__link-icon" aria-hidden="true">🏠</span>
                <span class="navbar__link-text">Dashboard</span>
            </a>
        </li>
        <li class="navbar__item">
            <a href="{{ url_for('students.list_students') }}" class="navbar__link{% if request.endpoint and request.endpoint.startswith('students_') %} navbar__link--active{% endif %}">
                <span class="navbar__link-icon" aria-hidden="true">👥</span>
                <span class="navbar__link-text">Students</span>
            </a>
        </li>
        <li class="navbar__item">
            <a href="{{ url_for('subjects.list_subjects') }}" class="navbar__link{% if request.endpoint and request.endpoint.startswith('subjects_') %} navbar__link--active{% endif %}">
                <span class="navbar__link-icon" aria-hidden="true">📚</span>
                <span class="navbar__link-text">Subjects</span>
            </a>
        </li>
        <li class="navbar__item">
            <a href="{{ url_for('marks.list_marks') }}" class="navbar__link{% if request.endpoint and request.endpoint.startswith('marks_') %} navbar__link--active{% endif %}">
                <span class="navbar__link-icon" aria-hidden="true">📝</span>
                <span class="navbar__link-text">Marks</span>
            </a>
        </li>
        <li class="navbar__item">
            <a href="{{ url_for('results.list_results') }}" class="navbar__link{% if request.endpoint and request.endpoint.startswith('results_') %} navbar__link--active{% endif %}">
                <span class="navbar__link-icon" aria-hidden="true">📊</span>
                <span class="navbar__link-text">Results</span>
            </a>
        </li>
        <li class="navbar__item">
            <a href="{{ url_for('analysis.index') }}" class="navbar__link{% if request.endpoint and request.endpoint.startswith('analysis_') %} navbar__link--active{% endif %}">
                <span class="navbar__link-icon" aria-hidden="true">📈</span>
                <span class="navbar__link-text">Analysis</span>
            </a>
        </li>
        <li class="navbar__item">
            <a href="{{ url_for('reports.index') }}" class="navbar__link{% if request.endpoint and request.endpoint.startswith('reports_') %} navbar__link--active{% endif %}">
                <span class="navbar__link-icon" aria-hidden="true">📄</span>
                <span class="navbar__link-text">Reports</span>
            </a>
        </li>
    </ul>

    <ul class="navbar__menu navbar__menu--right">
        <li class="navbar__item">
            <a href="{{ url_for('profile.index') }}" class="navbar__link{% if request.endpoint and request.endpoint.startswith('profile') %} navbar__link--active{% endif %}" title="Admin Profile">
                <span class="navbar__link-icon" aria-hidden="true">👤</span>
                <span class="navbar__link-text">Profile</span>
            </a>
        </li>
        <li class="navbar__item">
            <form method="post" action="{{ url_for('auth.logout') }}" class="navbar__form">
                <button type="submit" class="navbar__link navbar__link--logout">
                    <span class="navbar__link-icon" aria-hidden="true">👋</span>
                    <span class="navbar__link-text">Logout</span>
                </button>
            </form>
        </li>
    </ul>
</nav>
