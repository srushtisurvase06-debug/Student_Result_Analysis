{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="container">
    <div class="error-page">
        <div class="error-page__code">500</div>
        <h1 class="error-page__heading">Something Went Wrong</h1>
        <p class="error-page__message">An unexpected error occurred on our end. Please try again later.</p>
        <a href="{{ url_for('dashboard.index') }}" class="error-page__action">
            <span aria-hidden="true">🏠</span>
            <span>Return to Dashboard</span>
        </a>
    </div>
</div>
{% endblock %}
